<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nextday</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0F172A">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
    }

    :root {
      --bg-color: #0F172A;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #38BDF8;
      --accent-hover: #0EA5E9;
      --danger: #EF4444;
      --success: #10B981;
      --glass-blur: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      line-height: 1.5;
    }

    #app {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glassmorphic Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px -10px rgba(0,0,0,0.6);
    }

    /* Navigation Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.02);
    }
    .nav-btn:active {
      transform: scale(0.98);
    }

    h1.date-title {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      flex-grow: 1;
      background: -webkit-linear-gradient(45deg, #38BDF8, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Weather Widget */
    .weather {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .weather-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .weather-icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
    .weather-temps {
      display: flex;
      flex-direction: column;
    }
    .temp-high { font-size: 1.5rem; font-weight: 700; }
    .temp-low { color: var(--text-muted); font-size: 0.9rem; }
    .weather-details {
      display: flex;
      gap: 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .w-detail {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .weather-hourly {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
      justify-content: space-around;
    }
    .hourly-point {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .hourly-time { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .hourly-icon { font-size: 1.25rem; }
    .hourly-temp { font-weight: 600; font-size: 0.95rem; }

    /* Section Titles */
    h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: var(--card-border);
    }

    /* Lists */
    ul { list-style: none; }
    li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    li:last-child { border-bottom: none; padding-bottom: 0; }
    
    /* Calendar */
    .event {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .event-time {
      font-weight: 600;
      color: var(--accent);
      width: 60px;
      flex-shrink: 0;
    }
    .event-details { flex-grow: 1; }
    .event-title { font-weight: 500; }
    .event-duration { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;}

    /* Kids Section */
    .kid-block {
      margin-bottom: 24px;
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
      padding: 16px;
    }
    .kid-block:last-child { margin-bottom: 0; }
    .kid-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #A78BFA;
      margin-bottom: 12px;
    }
    
    .data-row {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .data-label {
      width: 80px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .data-content { flex-grow: 1; }
    .data-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .subject-tag {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* Utilities */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
      color: var(--text-muted);
      gap: 16px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-inline {
      color: var(--danger);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
    }
    .error-full {
      text-align: center;
      padding: 40px;
    }
    .btn-retry {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 16px;
      cursor: pointer;
    }

    .empty-state {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 8px 0;
    }
    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 32px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-title { font-size: 1.5rem; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; }

    .settings-group { margin-bottom: 24px; }
    .settings-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type="text"] {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      flex-grow: 1;
      font-family: inherit;
    }
    
    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .widget-order-item {
      background: rgba(255,255,255,0.05);
      margin-bottom: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-btns { display: flex; gap: 4px; }
    .order-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .save-bar {
      margin-top: 32px;
      display: flex;
      gap: 12px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      flex-grow: 1;
      cursor: pointer;
    }

    .theme-picker {
      display: flex;
      gap: 12px;
    }
    .theme-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .theme-dot.active { border-color: #fff; }

    #holidayBadge {
      display: none;
      justify-content: center;
      margin-top: -8px;
    }
    .holiday-pill {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 5px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <button class="nav-btn" id="prevBtn" aria-label="Previous day">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="date-title" id="dateTitle">LOADING...</h1>
      <button class="nav-btn" id="nextBtn" aria-label="Next day">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="nav-btn" id="openSettingsBtn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </header>

    <div id="holidayBadge"></div>

    <div id="content">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Settings</div>
        <button class="close-btn" id="closeSettingsBtn" aria-label="Close settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>


      <div class="settings-group">
        <label class="settings-label">Layout Order</label>
        <div id="widgetList">
          <!-- draggable items -->
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label">Accent Color</label>
        <div class="theme-picker" id="themePicker">
          <div class="theme-dot" style="background:#38BDF8" data-color="#38BDF8"></div>
          <div class="theme-dot" style="background:#A78BFA" data-color="#A78BFA"></div>
          <div class="theme-dot" style="background:#F472B6" data-color="#F472B6"></div>
          <div class="theme-dot" style="background:#34D399" data-color="#34D399"></div>
          <div class="theme-dot" style="background:#FB923C" data-color="#FB923C"></div>
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label">Global Credentials</label>
        <div style="background:rgba(0,0,0,0.2); padding:16px; border-radius:16px; display:flex; flex-direction:column; gap:12px;">
          <div>
            <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">Wilma Base URL</label>
            <input type="text" id="wilmaBaseUrl" placeholder="https://pirkkala.inschool.fi">
          </div>
          <div>
            <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">Wilma Username</label>
            <input type="text" id="wilmaUser" placeholder="email@example.com">
          </div>
          <div>
            <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">Wilma Password <span id="wilmaPassStatus" style="color:var(--text-muted); font-weight:normal;"></span></label>
            <input type="password" id="wilmaPass" placeholder="Leave blank to keep the current password" style="background:rgba(255,255,255,0.05); border:1px solid var(--card-border); border-radius:12px; padding:12px; color:#fff; width:100%;">
          </div>
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label">Calendars (Google iCal URLs)</label>
        <div id="calendarList" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button type="button" class="btn-primary" style="margin-top:8px;" id="addCalendarBtn">+ Add calendar</button>
      </div>

      <div class="save-bar">
        <button class="btn-primary" id="saveSettingsBtn">Save Configuration</button>
      </div>
      <div class="save-bar">
        <button type="button" class="nav-btn" id="logoutBtn" style="width:100%; justify-content:center;">Log out</button>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
